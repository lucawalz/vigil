name: dependabot-auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    uses: lucawalz/.github/.github/workflows/dependabot-automerge.yml@512d402b682a017ae2629ee41f794686a8d1468c # v0.1.0
    permissions:
      contents: write
      pull-requests: write
