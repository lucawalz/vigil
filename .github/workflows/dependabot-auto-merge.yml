name: dependabot-auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    uses: lucawalz/.github/.github/workflows/dependabot-automerge.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: write
      pull-requests: write
