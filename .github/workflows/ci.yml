name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: Ruff
        run: make lint-py

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: Pytest (agents and eval)
        run: make test-py

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: basedpyright
        run: make typecheck

  lockfile-drift:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Check lockfile is up to date
        run: make lock-check

  commit-format:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|chore|ci|docs|refactor|perf|test|build)(\([a-z0-9-]+\))?: [a-z0-9](.*[^.])?$'
          failed=0
          check() {
            if ! [[ $1 =~ $pattern ]]; then
              echo "::error::Commit subject does not follow Conventional Commits: $1"
              failed=1
            fi
          }
          check "$PR_TITLE"
          while IFS= read -r subject; do
            check "$subject"
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install dependencies
        run: make setup
      - name: zizmor and actionlint
        run: make workflow-lint

  detect-go-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: set-modules
        run: |
          echo "modules=$(grep -E '^\s+\./' go.work | tr -d '\t ' | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  go-lint:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}

  go-test:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: go build and test (${{ matrix.module }})
        env:
          MODULE: ${{ matrix.module }}
        run: make build test-go GO_MODULES="$MODULE"

  govulncheck:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: govulncheck (${{ matrix.module }})
        env:
          MODULE: ${{ matrix.module }}
        run: make vuln GO_MODULES="$MODULE"

  terraform-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
      - name: terraform fmt, init and validate
        run: make tf-check

  nix-vendor-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect go module or nixos changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- 'mcp-servers/*/go.mod' 'mcp-servers/*/go.sum' infra/nixos infra/inventory.json infra/lab; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod, go.sum, infra/nixos, infra/inventory.json or infra/lab changes; vendor hash check skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Recompute vendor hashes
        if: steps.changes.outputs.run == 'true'
        run: make vendor-hash
      - name: Require committed vendor hashes to match
        if: steps.changes.outputs.run == 'true'
        run: git diff --exit-code
      - name: Evaluate nixos configurations
        if: steps.changes.outputs.run == 'true'
        run: make nix-check

  lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAB_STATE: /home/runner/.local/state/vigil-lab
      SSH_TIMEOUT_S: 30
      THROUGHPUT_SSH_TIMEOUT_S: 120
      ALERTMANAGER_READY_TIMEOUT_S: 120
      ALERT_LOG_TIMEOUT_S: 180
      ROLLBACK_RETURN_TIMEOUT_S: 600
      ROLLBACK_BUILD_TIMEOUT_S: 900
      MCP_INIT_TIMEOUT_S: 60
      MCP_CALL_TIMEOUT_S: 300
      ALERTMANAGER_LOCAL_PORT: 19093
      IPERF_PORT: 5201
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect lab changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- \
              infra/nixos infra/lab infra/overlays/lab infra/inventory.json infra/scripts infra/kubernetes \
              infra/overlays/hetzner/kubernetes/clusters/hetzner/namespaces \
              infra/overlays/hetzner/kubernetes/clusters/hetzner/sources \
              infra/overlays/hetzner/kubernetes/clusters/hetzner/apps \
              infra/overlays/hetzner/kubernetes/clusters/hetzner/infrastructure/monitoring/kube-prometheus-stack \
              mcp-servers eval/scripts agents/orchestrator .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No lab-relevant changes; lab smoke skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Free runner disk
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          { echo "### Free disk after cleanup"; echo '```'; df -h /; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changes.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@v23
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Lab up
        if: steps.changes.outputs.run == 'true'
        env:
          LAB_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          LAB_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          nix run ./infra/nixos#lab -- up --no-golden --repo "$LAB_REPO" --branch "$LAB_BRANCH"
          { echo "### Free disk after lab up"; echo '```'; df -h /; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Agent start
        if: steps.changes.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_MODEL_NAME: lab-smoke
          OLLAMA_BASE_URL: http://127.0.0.1:1/v1
          OLLAMA_API_KEY: unused
        run: |
          uv sync --locked --all-packages
          nix run ./infra/nixos#lab -- agent start
          { echo "### Free disk after agent start"; echo '```'; df -h /; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Health gate
        if: steps.changes.outputs.run == 'true'
        run: |
          set -a; . "$LAB_STATE/lab.env"; set +a
          eval/scripts/health-gate.sh "$EVAL_RUNNER_KUBECONFIG"
      - name: Boot through SeaBIOS and GRUB
        if: steps.changes.outputs.run == 'true'
        run: |
          timeout "$SSH_TIMEOUT_S" "$LAB_STATE/bin/ssh" vigil-worker-1 \
            'test ! -d /sys/firmware/efi && grep -q "^BOOT_IMAGE=" /proc/cmdline && test -f /boot/EFI/BOOT/BOOTX64.EFI'
      - name: Record guest memory
        if: steps.changes.outputs.run == 'true'
        run: |
          {
            echo "### Guest memory with the Alertmanager stack"
            for h in vigil-control-plane-1 vigil-worker-1 vigil-worker-2; do
              echo "#### $h"; echo '```'; timeout "$SSH_TIMEOUT_S" "$LAB_STATE/bin/ssh" "$h" free -m; echo '```'
            done
            echo "### Alertmanager stack pods (subtract for the figure without them)"
            echo '```'; kubectl --kubeconfig "$LAB_STATE/kube/admin.yaml" top pods -n monitoring || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Alertmanager reaches the native orchestrator
        if: steps.changes.outputs.run == 'true'
        run: |
          kubectl --kubeconfig "$LAB_STATE/kube/admin.yaml" -n monitoring \
            port-forward svc/kube-prometheus-stack-alertmanager "$ALERTMANAGER_LOCAL_PORT:9093" > /dev/null 2>&1 &
          PF=$!
          trap 'kill "$PF"' EXIT
          DEADLINE=$(($(date +%s) + ALERTMANAGER_READY_TIMEOUT_S))
          until curl -sf "http://127.0.0.1:$ALERTMANAGER_LOCAL_PORT/-/ready" > /dev/null; do
            [ "$(date +%s)" -gt "$DEADLINE" ] && { echo "alertmanager not ready"; exit 1; }
            sleep 2
          done
          curl -sf -X POST -H 'Content-Type: application/json' "http://127.0.0.1:$ALERTMANAGER_LOCAL_PORT/api/v2/alerts" \
            -d '[{"labels":{"alertname":"LabSmoke","severity":"warning"}}]'
          DEADLINE=$(($(date +%s) + ALERT_LOG_TIMEOUT_S))
          until grep -q "ignoring alert-triggered run" "$LAB_STATE/logs/agent.log"; do
            [ "$(date +%s)" -gt "$DEADLINE" ] && { tail -n 50 "$LAB_STATE/logs/agent.log"; exit 1; }
            sleep 5
          done
      - name: Rollback gate returns to the boot default
        if: steps.changes.outputs.run == 'true'
        run: |
          set -a; . "$LAB_STATE/lab.env"; set +a
          S() { timeout "$SSH_TIMEOUT_S" "$LAB_STATE/bin/ssh" "$@"; }
          BOOT_DEFAULT=$(S vigil-worker-1 readlink -f /run/current-system)
          timeout "$ROLLBACK_BUILD_TIMEOUT_S" "$LAB_STATE/bin/ssh" vigil-worker-1 bash -s <<'EOF'
            set -e
            rm -rf /root/smoke && cp -a /opt/vigil /root/smoke
            D=/root/smoke/infra/nixos/hosts/vigil-worker-1
            printf "{ ... }:\n{\n  environment.etc.\"vigil-smoke-marker\".text = \"staged\";\n}\n" > "$D/bad-module.nix"
            sed -i "s|imports = \[|imports = [\n    ./bad-module.nix|" "$D/default.nix"
            cd /root/smoke && nixos-rebuild build --flake "/root/smoke/infra/nixos#$(cat /etc/vigil/flake-attr)"
            nix-env -p /nix/var/nix/profiles/system --set "$(readlink -f /root/smoke/result)"
          EOF
          GEN=$(S vigil-worker-1 "nix-env -p /nix/var/nix/profiles/system --list-generations | awk 'END {print \$1}'")
          coproc MCP { nixos-mcp 2>>"$LAB_STATE/logs/smoke-nixos-mcp.log"; }
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"lab-smoke","version":"1"}}}' >&"${MCP[1]}"
          read -r -t "$MCP_INIT_TIMEOUT_S" INIT <&"${MCP[0]}"
          echo "$INIT" | jq -e '.result.serverInfo.name == "nixos-mcp"'
          printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' >&"${MCP[1]}"
          printf '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"stage_generation","arguments":{"host":"vigil-worker-1","generation":%s}}}\n' "$GEN" >&"${MCP[1]}"
          read -r -t "$MCP_CALL_TIMEOUT_S" RESULT <&"${MCP[0]}"
          kill "$MCP_PID"
          echo "$RESULT" | jq -e '.result.isError != true'
          S vigil-worker-1 test -f /etc/vigil-smoke-marker
          DEADLINE=$(($(date +%s) + ROLLBACK_RETURN_TIMEOUT_S))
          until [ "$(S vigil-worker-1 readlink -f /run/current-system 2>/dev/null)" = "$BOOT_DEFAULT" ] \
                && ! S vigil-worker-1 test -e /etc/vigil-smoke-marker; do
            [ "$(date +%s)" -gt "$DEADLINE" ] && { echo "rollback gate did not return to $BOOT_DEFAULT"; exit 1; }
            sleep 10
          done
          echo "rollback gate rebooted into $BOOT_DEFAULT"
      - name: Hub throughput
        if: steps.changes.outputs.run == 'true'
        continue-on-error: true
        run: |
          S() { timeout "$THROUGHPUT_SSH_TIMEOUT_S" "$LAB_STATE/bin/ssh" "$@"; }
          W2=$(nix eval --raw ./infra/nixos#lib.addresses.hosts.vigil-worker-2.ip)
          S vigil-worker-2 "iptables -I nixos-fw -p tcp --dport $IPERF_PORT -j nixos-fw-accept && nix run --inputs-from /opt/nixos-config nixpkgs#iperf3 -- -s -p $IPERF_PORT -D -1"
          { echo "### Hub throughput worker-1 to worker-2"; echo '```'
            S vigil-worker-1 "nix run --inputs-from /opt/nixos-config nixpkgs#iperf3 -- -c $W2 -p $IPERF_PORT -t 10"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lab logs
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lab-smoke-logs
          path: /home/runner/.local/state/vigil-lab/logs/
          if-no-files-found: warn
      - name: Lab down and destroy
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          nix run ./infra/nixos#lab -- down
          nix run ./infra/nixos#lab -- destroy
          if pgrep -f qemu-system || pgrep -f 'vigil_lab hub'; then exit 1; fi
          test ! -e "$LAB_STATE"

  ci-gate:
    if: always()
    needs:
      - python-lint
      - python-test
      - python-typecheck
      - lockfile-drift
      - commit-format
      - workflow-lint
      - detect-go-modules
      - go-lint
      - go-test
      - govulncheck
      - terraform-lint
      - nix-vendor-hash
      - lab-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lockfile-drift,commit-format
