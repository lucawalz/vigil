name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: Ruff
        run: make lint-py

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: Pytest (agents and eval)
        run: make test-py

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: make setup
      - name: basedpyright
        run: make typecheck

  lockfile-drift:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Check lockfile is up to date
        run: make lock-check

  commit-format:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|chore|ci|docs|refactor|perf|test|build)(\([a-z0-9-]+\))?: [a-z0-9](.*[^.])?$'
          failed=0
          check() {
            if ! [[ $1 =~ $pattern ]]; then
              echo "::error::Commit subject does not follow Conventional Commits: $1"
              failed=1
            fi
          }
          check "$PR_TITLE"
          while IFS= read -r subject; do
            check "$subject"
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Install dependencies
        run: make setup
      - name: zizmor and actionlint
        run: make workflow-lint

  detect-go-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: set-modules
        run: |
          echo "modules=$(grep -E '^\s+\./' go.work | tr -d '\t ' | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  go-lint:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}

  go-test:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: go build and test (${{ matrix.module }})
        env:
          MODULE: ${{ matrix.module }}
        run: make build test-go GO_MODULES="$MODULE"

  govulncheck:
    needs: detect-go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck (${{ matrix.module }})
        env:
          MODULE: ${{ matrix.module }}
        run: make vuln GO_MODULES="$MODULE"

  terraform-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
      - name: terraform fmt, init and validate
        run: make tf-check

  nix-vendor-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect go module or nixos changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- 'mcp-servers/*/go.mod' 'mcp-servers/*/go.sum' infra/nixos; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod, go.sum or infra/nixos changes; vendor hash check skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Recompute vendor hashes
        if: steps.changes.outputs.run == 'true'
        run: make vendor-hash
      - name: Require committed vendor hashes to match
        if: steps.changes.outputs.run == 'true'
        run: git diff --exit-code
      - name: Evaluate nixos configurations
        if: steps.changes.outputs.run == 'true'
        run: make nix-check

  ci-gate:
    if: always()
    needs:
      - python-lint
      - python-test
      - python-typecheck
      - lockfile-drift
      - commit-format
      - workflow-lint
      - detect-go-modules
      - go-lint
      - go-test
      - govulncheck
      - terraform-lint
      - nix-vendor-hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lockfile-drift,commit-format
