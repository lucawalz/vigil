name: Eval Campaign

on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: "Number of seeds"
        type: choice
        required: false
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
      model:
        description: "LLM model identifier"
        type: choice
        required: false
        default: "claude-sonnet-4-6"
        options:
          - claude-sonnet-4-6
          - gpt-oss:120b
      location:
        description: "Hetzner EU region for the eval cluster"
        type: choice
        required: false
        default: "hel1"
        options:
          - hel1
          - fsn1
          - nbg1
      skip_k8s:
        description: "Skip the k8s scenario group"
        type: boolean
        required: false
        default: false
      skip_os:
        description: "Skip the os scenario group"
        type: boolean
        required: false
        default: false
      skip_destroy:
        description: "Skip terraform destroy"
        type: boolean
        required: false
        default: false
      target:
        description: "Where the cells run: hetzner (Terraform cluster) or runner (lab VMs on the GitHub runner)"
        type: choice
        required: false
        default: hetzner
        options:
          - hetzner
          - runner
      parallel:
        description: "Run cells in parallel on target runner; Hetzner cells always run one after another."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      max_parallel: ${{ steps.build.outputs.max_parallel }}
    steps:
      - id: build
        env:
          SKIP_K8S: ${{ inputs.skip_k8s }}
          SKIP_OS: ${{ inputs.skip_os }}
          SEED_COUNT: ${{ inputs.seed_count }}
          PARALLEL: ${{ inputs.parallel }}
          TARGET: ${{ inputs.target }}
        run: |
          base='[]'
          if [ "$SKIP_K8S" != 'true' ]; then
            base=$(echo "$base" | jq -c '. + [{"group":"k8s","scenarios":"k8s-1g k8s-2g k8s-3g k8s-4g k8s-5g live-quota-injected deceptive-2 k8s-rollback-1"}]')
          fi
          if [ "$SKIP_OS" != 'true' ]; then
            base=$(echo "$base" | jq -c '. + [{"group":"os","scenarios":"os-1 os-1g os-drift-sysctl os-stale-generation disk-pressure"}]')
          fi
          seeds=$(jq -cn --argjson n "$SEED_COUNT" '[range(1; $n + 1)]')
          include=$(jq -cn --argjson base "$base" --argjson seeds "$seeds" \
            '[ $seeds[] as $s | $base[] | . + {seed:$s} ]')
          echo "matrix=$(jq -cn --argjson inc "$include" '{include:$inc}')" >> "$GITHUB_OUTPUT"
          if [ "$PARALLEL" = 'true' ] && [ "$TARGET" = 'runner' ]; then
            echo "max_parallel=$(jq -n --argjson inc "$include" '[$inc | length, 1] | max')" >> "$GITHUB_OUTPUT"
          else
            echo "max_parallel=1" >> "$GITHUB_OUTPUT"
          fi

  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: eval
      deployment: false
    steps:
      - name: Check required secrets
        env:
          MODEL: ${{ inputs.model }}
          TARGET: ${{ inputs.target }}
          VIGIL_GITHUB_TOKEN: ${{ secrets.VIGIL_GITHUB_TOKEN }}
          TF_VAR_HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          TF_VAR_LLM_MODEL_NAME: ${{ secrets.TF_VAR_LLM_MODEL_NAME }}
          OPERATOR_SSH_PUBKEY: ${{ secrets.OPERATOR_SSH_PUBKEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TF_VAR_ANTHROPIC_API_KEY: ${{ secrets.TF_VAR_ANTHROPIC_API_KEY }}
          TF_VAR_OLLAMA_API_KEY: ${{ secrets.TF_VAR_OLLAMA_API_KEY }}
          TF_VAR_OLLAMA_BASE_URL: ${{ secrets.TF_VAR_OLLAMA_BASE_URL }}
        run: |
          required=(VIGIL_GITHUB_TOKEN TF_VAR_LLM_MODEL_NAME)
          if [ "$TARGET" = hetzner ]; then
            required+=(TF_VAR_HCLOUD_TOKEN OPERATOR_SSH_PUBKEY SOPS_AGE_KEY)
          fi
          if [[ "$MODEL" == claude-* ]]; then
            required+=(TF_VAR_ANTHROPIC_API_KEY)
          else
            required+=(TF_VAR_OLLAMA_API_KEY TF_VAR_OLLAMA_BASE_URL)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets in the eval environment: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets for target $TARGET are set"

  snapshots:
    needs: check-secrets
    if: inputs.target == 'hetzner'
    permissions:
      contents: read
    uses: ./.github/workflows/build-nixos-snapshots.yml

  run-scenarios:
    needs: [setup, check-secrets, snapshots]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.check-secrets.result == 'success' && needs.snapshots.result != 'failure' && needs.setup.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: eval
      deployment: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.setup.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      TF_VAR_group_name: ${{ matrix.group }}
      TF_VAR_run_id: ${{ github.run_id }}-${{ matrix.group }}-s${{ matrix.seed }}
      TF_VAR_campaign_run_id: ${{ github.run_id }}
      TF_VAR_vigil_branch: eval/${{ github.run_id }}/${{ matrix.group }}-${{ matrix.seed }}
      VIGIL_EVAL_BRANCH: eval/${{ github.run_id }}/${{ matrix.group }}-${{ matrix.seed }}
      VIGIL_EVAL_TARGET: ${{ inputs.target }}
      TF_VAR_location: ${{ inputs.location }}
      LAB_STATE: /home/runner/.local/state/vigil-lab
      LAB_ENV: /home/runner/.local/state/vigil-lab/lab.env
      GROUP: ${{ matrix.group }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create cell branch
        env:
          GH_TOKEN: ${{ secrets.VIGIL_GITHUB_TOKEN }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$VIGIL_EVAL_BRANCH" -f sha="$MAIN_SHA" > /dev/null
          echo "created $VIGIL_EVAL_BRANCH at $MAIN_SHA"

      - name: Free runner disk
        if: inputs.target == 'runner'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: hashicorp/setup-terraform@v4
        if: inputs.target == 'hetzner'
        with:
          terraform_version: "~1.15"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Generate ephemeral SSH key
        if: inputs.target == 'hetzner'
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""

      - name: Prepare kube directory
        if: inputs.target == 'hetzner'
        run: mkdir -p ~/.kube

      - name: Terraform init
        if: inputs.target == 'hetzner'
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform apply
        if: inputs.target == 'hetzner'
        working-directory: infra/terraform
        env:
          TF_VAR_hcloud_token: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          TF_VAR_github_token: ${{ secrets.VIGIL_GITHUB_TOKEN }}
          TF_VAR_llm_model_name: ${{ secrets.TF_VAR_LLM_MODEL_NAME }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
          TF_VAR_anthropic_api_key: ${{ startsWith(inputs.model, 'claude-') && secrets.TF_VAR_ANTHROPIC_API_KEY || '' }}
          TF_VAR_ollama_api_key: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_API_KEY || '' }}
          TF_VAR_ollama_base_url: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_BASE_URL || '' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: terraform apply -auto-approve -input=false

      - name: Wait for kubeconfig
        if: inputs.target == 'hetzner'
        run: |
          KUBECONFIG="$HOME/.kube/hetzner-vigil-$GROUP"
          DEADLINE=$(($(date +%s) + 300))
          until [ -s "$KUBECONFIG" ]; do
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "kubeconfig not written after 5 minutes - terraform apply may have failed"
              ls -la ~/.kube/ || true
              exit 1
            fi
            echo "$(date -u +%H:%M:%SZ) waiting for $KUBECONFIG ..."
            sleep 5
          done
          echo "kubeconfig ready ($(wc -c < "$KUBECONFIG") bytes)"

      - name: Inject SOPS age key into Flux
        if: inputs.target == 'hetzner'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -o pipefail
          KCFG="$HOME/.kube/hetzner-vigil-$GROUP"
          (umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > /tmp/sops-age.txt)
          kubectl --kubeconfig "$KCFG" \
            create secret generic sops-age \
            --namespace=flux-system \
            --from-file=age.agekey=/tmp/sops-age.txt \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$KCFG" apply -f -
          rm -f /tmp/sops-age.txt
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for ks in flux-system cluster-namespaces cluster-sources cluster-secrets cluster-infrastructure cluster-apps; do
            kubectl --kubeconfig "$KCFG" \
              annotate kustomization "$ks" -n flux-system \
              "reconcile.fluxcd.io/requestedAt=$NOW" --overwrite || true
          done

      - name: Wait for Flux kustomizations ready
        if: inputs.target == 'hetzner'
        run: eval/scripts/wait-flux-ready.sh "$HOME/.kube/hetzner-vigil-$GROUP"

      - name: Resolve agent host IP
        id: agent
        if: inputs.target == 'hetzner'
        working-directory: infra/terraform
        run: |
          echo "ip=$(terraform output -raw agent_public_ip)" >> "$GITHUB_OUTPUT"
          echo "private_ip=$(terraform output -raw agent_private_ip)" >> "$GITHUB_OUTPUT"

      - name: Wait for orchestrator to be reachable
        if: inputs.target == 'hetzner'
        env:
          AGENT_IP: ${{ steps.agent.outputs.ip }}
        run: |
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          DEADLINE=$(($(date +%s) + 600))
          ITER=0
          until ssh "${SSH_OPTS[@]}" "root@$AGENT_IP" \
              "curl -sf http://localhost:9099/healthz > /dev/null 2>&1"; do
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "Orchestrator not ready after 10 minutes - diagnostics:"
              ssh "${SSH_OPTS[@]}" "root@$AGENT_IP" "
                systemctl status vigil-setup.service vigil-orchestrator.service --no-pager -l 2>&1 || true
                echo '--- journal: vigil-setup ---'
                journalctl -u vigil-setup.service --no-pager -n 200 2>&1 || true
                echo '--- journal: vigil-orchestrator ---'
                journalctl -u vigil-orchestrator.service --no-pager -n 200 2>&1 || true
                echo '--- port 9099 ---'
                ss -ltnp | grep 9099 || echo 'not listening'
                echo '--- /etc/vigil ---'
                ls -la /etc/vigil/ 2>&1 || true
                test -f /etc/vigil/env && sed 's/=.*\$/=REDACTED/' /etc/vigil/env || echo '/etc/vigil/env MISSING'
                echo '--- /root/vigil ---'
                ls -la /root/vigil/ 2>&1 || true
              " || true
              exit 1
            fi
            ITER=$((ITER + 1))
            if [ $((ITER % 6)) -eq 0 ]; then
              echo "--- orchestrator status (${ITER}x10s) ---"
              ssh "${SSH_OPTS[@]}" "root@$AGENT_IP" "
                systemctl is-active vigil-setup.service vigil-orchestrator.service 2>&1 || true
                journalctl -u vigil-setup.service -u vigil-orchestrator.service -n 20 --no-pager 2>&1 || true
              " || true
            fi
            sleep 10
          done

      - name: Lab up
        if: inputs.target == 'runner'
        run: nix run ./infra/nixos#lab -- up --no-golden --repo "$GITHUB_REPOSITORY" --branch "$VIGIL_EVAL_BRANCH"

      - name: Agent start
        if: inputs.target == 'runner'
        env:
          GITHUB_TOKEN: ${{ secrets.VIGIL_GITHUB_TOKEN }}
          LLM_MODEL_NAME: ${{ secrets.TF_VAR_LLM_MODEL_NAME }}
          ANTHROPIC_API_KEY: ${{ startsWith(inputs.model, 'claude-') && secrets.TF_VAR_ANTHROPIC_API_KEY || '' }}
          OLLAMA_API_KEY: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_API_KEY || '' }}
          OLLAMA_BASE_URL: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_BASE_URL || '' }}
          LLM_REASONING_EFFORT: none
          DIAGNOSIS_TIMEOUT_S: "600"
          REMEDIATION_TIMEOUT_S: "900"
          ORCHESTRATOR_RUN_TIMEOUT_S: "2400"
        run: |
          uv sync --locked --all-packages
          nix run ./infra/nixos#lab -- agent start

      - name: Initialize eval baseline
        env:
          AGENT_IP: ${{ steps.agent.outputs.ip }}
        run: |
          eval/scripts/agent-exec.sh 'bash eval/scripts/reset-eval-baseline.sh'
          eval/scripts/agent-exec.sh "\${VIGIL_ORCHESTRATOR_RESTART_CMD:-systemctl restart vigil-orchestrator.service}"
          DEADLINE=$(($(date +%s) + 120))
          until eval/scripts/agent-exec.sh "curl -sf \"\${VIGIL_ORCHESTRATOR_URL:-http://localhost:9099}/healthz\" > /dev/null"; do
            [ "$(date +%s)" -gt "$DEADLINE" ] && { echo "orchestrator did not recover after baseline reset"; exit 1; }
            sleep 5
          done
          eval/scripts/agent-exec.sh "bash eval/scripts/health-gate.sh \"\$EVAL_RUNNER_KUBECONFIG\""

      - name: Run scenarios in group
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          MODEL: ${{ inputs.model }}
          AGENT_IP: ${{ steps.agent.outputs.ip }}
          AGENT_PRIVATE_IP: ${{ steps.agent.outputs.private_ip }}
        run: |
          PREV=""
          for S in $SCENARIOS; do
            if [ -n "$PREV" ]; then
              SHA7=$(eval/scripts/agent-exec.sh 'git rev-parse --short=7 HEAD')
              SAFE_MODEL=$(printf '%s' "$MODEL" | tr -c 'a-zA-Z0-9_-' '-')
              PREV_RUN_ID="${PREV}_${SEED}_${SAFE_MODEL}_${SHA7}"
              echo "::group::between-scenarios prev=$PREV next=$S"
              printf -v REMOTE 'AGENT_HOST=%q PREV_RUN_ID=%q bash eval/scripts/between-scenarios.sh %q %q' \
                "$AGENT_PRIVATE_IP" "$PREV_RUN_ID" "$PREV" "$GROUP"
              eval/scripts/agent-exec.sh "$REMOTE" \
                || echo "between-scenarios returned non-zero"
              echo "::endgroup::"
            fi
            echo "::group::scenario $S"
            VIGIL_EVAL_STATUS=0
            printf -v REMOTE 'vigil-eval run --scenario %q --seed %q --model %q' \
              "$S" "$SEED" "$MODEL"
            eval/scripts/agent-exec.sh "$REMOTE" \
              || VIGIL_EVAL_STATUS=$?
            echo "::endgroup::"
            if [ "$VIGIL_EVAL_STATUS" -eq 10 ]; then
              echo "Campaign circuit breaker tripped (3 consecutive baseline_degraded) - aborting group $GROUP"
              break
            fi
            if [ "$VIGIL_EVAL_STATUS" -eq 1 ] || [ "$VIGIL_EVAL_STATUS" -eq 2 ]; then
              echo "scenario $S exited $VIGIL_EVAL_STATUS - recorded in runs_index.jsonl"
            elif [ "$VIGIL_EVAL_STATUS" -ne 0 ]; then
              echo "scenario $S exited $VIGIL_EVAL_STATUS - NOT recorded in runs_index.jsonl"
            fi
            PREV=$S
          done

      - name: Rsync run files from agent
        if: always() && inputs.target == 'hetzner'
        env:
          AGENT_IP: ${{ steps.agent.outputs.ip }}
        run: |
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          mkdir -p eval/runs
          ssh "${SSH_OPTS[@]}" "root@$AGENT_IP" "
            echo '=== systemctl status ==='
            systemctl status vigil-setup.service vigil-orchestrator.service --no-pager -l 2>&1 || true
            echo '=== journal: vigil-setup ==='
            journalctl -u vigil-setup.service --no-pager -n 500 2>&1 || true
            echo '=== journal: vigil-orchestrator ==='
            journalctl -u vigil-orchestrator.service --no-pager -n 500 2>&1 || true
            echo '=== port 9099 ==='
            ss -ltnp | grep 9099 || echo 'not listening'
            echo '=== /etc/vigil ==='
            ls -la /etc/vigil/ 2>&1 || true
            test -f /etc/vigil/env && sed 's/=.*\$/=REDACTED/' /etc/vigil/env || echo '/etc/vigil/env MISSING'
          " > "eval/runs/_diagnostics-$GROUP-s$SEED.log" 2>&1 || true
          rsync -avz -e "ssh ${SSH_OPTS[*]}" \
            "root@$AGENT_IP:/root/vigil/eval/runs/" ./eval/runs/ || true
          if ssh "${SSH_OPTS[@]}" "root@$AGENT_IP" "test -f /root/vigil/eval/runs_index.jsonl"; then
            rsync -avz -e "ssh ${SSH_OPTS[*]}" \
              "root@$AGENT_IP:/root/vigil/eval/runs_index.jsonl" \
              "./eval/runs/runs_index_$GROUP-s$SEED.jsonl" || true
          fi

      - name: Collect run files from the lab
        if: always() && inputs.target == 'runner'
        run: |
          mkdir -p eval/runs "eval/runs/_lab-logs-$GROUP-s$SEED"
          cp -R "$LAB_STATE/runs/." eval/runs/ 2>/dev/null || true
          cp "$LAB_STATE/runs_index.jsonl" "eval/runs/runs_index_$GROUP-s$SEED.jsonl" 2>/dev/null || true
          cp -R "$LAB_STATE/logs/." "eval/runs/_lab-logs-$GROUP-s$SEED/" 2>/dev/null || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: group-runs-${{ matrix.group }}-s${{ matrix.seed }}
          path: |
            eval/runs/
          if-no-files-found: warn

      - name: Terraform destroy
        if: always() && !inputs.skip_destroy && inputs.target == 'hetzner'
        working-directory: infra/terraform
        env:
          TF_VAR_hcloud_token: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          TF_VAR_github_token: ${{ secrets.VIGIL_GITHUB_TOKEN }}
          TF_VAR_llm_model_name: ${{ secrets.TF_VAR_LLM_MODEL_NAME }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
          TF_VAR_anthropic_api_key: ${{ startsWith(inputs.model, 'claude-') && secrets.TF_VAR_ANTHROPIC_API_KEY || '' }}
          TF_VAR_ollama_api_key: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_API_KEY || '' }}
          TF_VAR_ollama_base_url: ${{ !startsWith(inputs.model, 'claude-') && secrets.TF_VAR_OLLAMA_BASE_URL || '' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: terraform destroy -auto-approve -input=false

      - name: Lab destroy
        if: always() && inputs.target == 'runner'
        run: nix run ./infra/nixos#lab -- destroy

  hetzner-cleanup:
    needs: [check-secrets, snapshots, run-scenarios]
    if: always() && inputs.target == 'hetzner' && !inputs.skip_destroy && needs.check-secrets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: eval
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Delete every resource and snapshot of this campaign
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/hcloud_sweep.py --run "$RUN_ID"

  aggregate:
    needs: run-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    environment:
      name: eval
      deployment: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Download all group artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: group-runs-*
          merge-multiple: true
          path: eval/runs

      - name: Merge runs indexes
        run: |
          for f in eval/runs/runs_index_*.jsonl; do
            [ -f "$f" ] && cat "$f" >> eval/runs_index.jsonl
          done

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Aggregate
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
        run: uv run vigil-eval aggregate --seed-count "$SEED_COUNT"

      - name: Publish results to step summary
        run: cat eval/results/step_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to docs/eval-results
        if: ${{ env.LOCAL_RUN != '1' }}
        env:
          RESULTS_BRANCH: docs/eval-results
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin "${RESULTS_BRANCH}" 2>/dev/null || true
          if git rev-parse "origin/${RESULTS_BRANCH}" &>/dev/null; then
            git branch "${RESULTS_BRANCH}" "origin/${RESULTS_BRANCH}"
          else
            git fetch origin main
            git branch "${RESULTS_BRANCH}" origin/main
          fi
          git worktree add /tmp/eval-results "${RESULTS_BRANCH}"
          DEST="/tmp/eval-results/results/${RUN_ID}"
          mkdir -p "${DEST}/traces"
          cp eval/results/REPORT.md eval/results/summary.json "${DEST}/"
          cp eval/runs/*.json "${DEST}/" 2>/dev/null || true
          cp eval/runs/*_trace.jsonl "${DEST}/traces/" 2>/dev/null || true
          cd /tmp/eval-results
          git add "results/${RUN_ID}"
          if git diff --staged --quiet; then
            echo "No new results to record"
          else
            TIMESTAMP=$(TZ=Europe/Berlin date +%Y-%m-%dT%H:%M:%S%z)
            git commit -m "docs(eval): record campaign ${RUN_ID} (${TIMESTAMP})"
            git push origin "${RESULTS_BRANCH}"
          fi

      - name: Delete cell branches
        if: always() && !(inputs.skip_destroy && inputs.target == 'hetzner')
        env:
          GH_TOKEN: ${{ secrets.VIGIL_GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/eval/$RUN_ID/" --jq '.[].ref' \
            | while read -r ref; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" && echo "deleted $ref"
              done
