name: Build NixOS Snapshots

on:
  push:
    branches: [main]
    paths: ['infra/nixos/**', 'mcp-servers/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: eval
      deployment: false
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          if [ -n "$HCLOUD_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TF_VAR_HCLOUD_TOKEN is not set; snapshot build and cleanup skipped"
          fi

  build:
    needs: check-token
    if: needs.check-token.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: eval
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        role: [master, worker-1, worker-2, agent]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: hashicorp/setup-packer@v3
        with:
          version: "~1.11"

      - name: Compute NixOS tree hash
        id: hash
        run: |
          echo "nixos_hash=$(printf '%s\n' \
            "$(git rev-parse HEAD:infra/nixos)" \
            "$(git rev-parse HEAD:mcp-servers)" \
            | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Check for existing snapshot
        id: check
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          ROLE: ${{ matrix.role }}
          NIXOS_HASH: ${{ steps.hash.outputs.nixos_hash }}
        run: |
          COUNT=$(curl -sf -G \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            --data-urlencode "type=snapshot" \
            --data-urlencode "label_selector=vigil-role=$ROLE,vigil-nixos-hash=$NIXOS_HASH" \
            "https://api.hetzner.cloud/v1/images" \
            | jq '.images | length')
          echo "exists=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral SSH key
        if: steps.check.outputs.exists != 'true'
        run: ssh-keygen -t ed25519 -f /tmp/packer_key -N ""

      - name: Packer init
        if: steps.check.outputs.exists != 'true'
        working-directory: infra/packer
        run: packer init .

      - name: Build snapshot
        id: build
        if: steps.check.outputs.exists != 'true'
        working-directory: infra/packer
        env:
          PKR_VAR_hcloud_token: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
          PKR_VAR_role: ${{ matrix.role }}
          PKR_VAR_nixos_commit_sha: ${{ github.sha }}
          PKR_VAR_nixos_hash: ${{ steps.hash.outputs.nixos_hash }}
          PKR_VAR_ssh_private_key_file: /tmp/packer_key
        run: packer build .

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: eval
      deployment: false
    needs: [check-token, build]
    if: always() && needs.check-token.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cleanup leaked Packer SSH keys
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          IDS=$(curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/ssh_keys?per_page=50" \
            | jq -r '.ssh_keys[] | select(.name | startswith("packer-")) | .id')
          for ID in $IDS; do
            echo "Deleting leaked Packer SSH key $ID"
            curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
              "https://api.hetzner.cloud/v1/ssh_keys/$ID"
          done

      - name: Cleanup leaked Packer servers
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          IDS=$(curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/servers?per_page=50" \
            | jq -r '.servers[] | select(.name | startswith("packer-")) | .id')
          for ID in $IDS; do
            echo "Deleting leaked Packer server $ID"
            curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
              "https://api.hetzner.cloud/v1/servers/$ID"
          done

      - name: Delete stale snapshots
        env:
          HCLOUD_TOKEN: ${{ secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          CURRENT_HASH=$(printf '%s\n' \
            "$(git rev-parse HEAD:infra/nixos)" \
            "$(git rev-parse HEAD:mcp-servers)" \
            | sha256sum | cut -c1-40)
          for ROLE in master worker-1 worker-2 agent; do
            OLD_IDS=$(curl -sf -G \
              -H "Authorization: Bearer $HCLOUD_TOKEN" \
              --data-urlencode "type=snapshot" \
              --data-urlencode "label_selector=vigil-role=$ROLE,vigil-managed=true" \
              "https://api.hetzner.cloud/v1/images?per_page=50" \
              | jq -r --arg hash "$CURRENT_HASH" \
                '.images[] | select(.labels["vigil-nixos-hash"] != $hash) | .id')
            for ID in $OLD_IDS; do
              echo "Deleting stale snapshot $ID (role=$ROLE)"
              curl -sf -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" \
                "https://api.hetzner.cloud/v1/images/$ID"
            done
          done
