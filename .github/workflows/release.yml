name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name != 'v1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Check version and changelog
        run: |
          version="${TAG#v}"
          project_version="$(uv version --short --frozen)"
          if [ "$project_version" != "${version/-rc./rc}" ]; then
            echo "::error::pyproject.toml version $project_version does not match tag $TAG"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Require a green ci-gate on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci-gate" > "$RUNNER_TEMP/check-runs.json"
          if ! jq -e 'any(.check_runs[]; .conclusion == "success")' "$RUNNER_TEMP/check-runs.json" > /dev/null; then
            echo "::error::ci-gate has not succeeded on $SHA; wait for a green ci-gate before tagging"
            exit 1
          fi

      - name: Copy the release notes from the changelog
        run: |
          heading="## [${TAG#v}]"
          awk -v heading="$heading" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md section $heading is empty"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

  comment:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comment on the issues and pull requests referenced in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc.*' "$TAG^")
          body="Released in [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)."
          git log --format=%s "$previous..$TAG" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p' | sort -un | while read -r number; do
            author=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .user.login)
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body' | grep -qxF "$body"; then
              continue
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f "labels[]=released" > /dev/null
            echo "Commented on and labelled #$number"
            sleep 1
          done
