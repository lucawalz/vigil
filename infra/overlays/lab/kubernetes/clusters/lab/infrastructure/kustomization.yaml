apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storageclass.yaml
  - ../../../../../hetzner/kubernetes/clusters/hetzner/infrastructure/monitoring/kube-prometheus-stack
configMapGenerator:
  - name: prometheus-lab-values
    namespace: monitoring
    files:
      - values.yaml=values-lab.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: prometheus-lab-values
          valuesKey: values.yaml
